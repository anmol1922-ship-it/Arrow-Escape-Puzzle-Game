name: Arrow Escape CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        id: install-dependencies
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund >"$GITHUB_WORKSPACE/npm-install-diagnostic.txt" 2>&1
          status=$?
          cat "$GITHUB_WORKSPACE/npm-install-diagnostic.txt"
          exit "$status"
      - name: Publish npm install diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ github.workspace }}/npm-install-diagnostic.txt
        with:
          script: |
            const fs = require("node:fs");
            const path = "npm-install-diagnostic.txt";
            const content = fs.readFileSync(process.env.REPORT_FILE);
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: process.env.GITHUB_REF_NAME
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "ci: publish npm install diagnostics [skip ci]",
              content: content.toString("base64"),
              branch: process.env.GITHUB_REF_NAME,
              ...(sha ? { sha } : {})
            });
      - name: Stop after dependency install failure
        if: steps.install-dependencies.outcome == 'failure'
        run: exit 1
      - name: Validate levels
        run: npm run validate:levels
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest
      - name: Start API and probe health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          timeout 15 bash -c 'until curl --fail http://127.0.0.1:8000/health; do :; done'
