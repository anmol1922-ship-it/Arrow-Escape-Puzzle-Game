name: Arrow Escape CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend diagnostics
        id: frontend-diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          report_file="$GITHUB_WORKSPACE/frontend-ci-diagnostic.txt"
          : > "$report_file"

          run_check() {
            printf '\n>>> %s\n' "$1" >> "$report_file"
            shift
            "$@" >>"$report_file" 2>&1
            status=$?
            printf 'exit=%s\n' "$status" >> "$report_file"
            return "$status"
          }

          failed=0
          run_check "npm run validate:levels" npm run validate:levels || failed=1
          run_check "npm run lint" npm run lint || failed=1
          run_check "npm run test -- --run" npm run test -- --run || failed=1
          run_check "npm run build" npm run build || failed=1
          cat "$report_file"
          exit "$failed"
      - name: Publish frontend diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ github.workspace }}/frontend-ci-diagnostic.txt
        with:
          script: |
            const fs = require("node:fs");
            const path = "frontend-ci-diagnostic.txt";
            const content = fs.readFileSync(process.env.REPORT_FILE);
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: process.env.GITHUB_REF_NAME
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "ci: publish frontend diagnostics [skip ci]",
              content: content.toString("base64"),
              branch: process.env.GITHUB_REF_NAME,
              ...(sha ? { sha } : {})
            });
      - name: Fail frontend diagnostics
        if: steps.frontend-diagnostic.outcome == 'failure'
        run: exit 1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest
      - name: Start API and probe health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          timeout 15 bash -c 'until curl --fail http://127.0.0.1:8000/health; do :; done'
