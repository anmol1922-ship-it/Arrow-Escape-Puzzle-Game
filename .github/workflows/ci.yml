name: Arrow Escape CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read
  issues: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture frontend check output
        id: frontend-diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          report_file="$RUNNER_TEMP/frontend-checks.txt"
          : > "$report_file"

          run_check() {
            printf '\n>>> %s\n' "$1" | tee -a "$report_file"
            shift
            "$@" >>"$report_file" 2>&1
            status=$?
            printf 'exit=%s\n' "$status" | tee -a "$report_file"
            return "$status"
          }

          failed=0
          run_check "npm run validate:levels" npm run validate:levels || failed=1
          run_check "npm run lint" npm run lint || failed=1
          run_check "npm run test -- --run" npm run test -- --run || failed=1
          run_check "npm run build" npm run build || failed=1
          cat "$report_file"
          exit "$failed"
      - name: Report frontend failure details
        if: steps.frontend-diagnostic.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ runner.temp }}/frontend-checks.txt
        with:
          script: |
            const fs = require("node:fs");
            const report = fs.readFileSync(process.env.REPORT_FILE, "utf8");
            const trimmed = report.length > 6000 ? report.slice(-6000) : report;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Frontend diagnostic for ${context.sha}:\n\n\\`\\`\\`text\n${trimmed}\n\\`\\`\\``
            });
      - name: Fail frontend diagnostic
        if: steps.frontend-diagnostic.outcome == 'failure'
        run: exit 1
      - name: Validate levels
        run: npm run validate:levels
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest
      - name: Start API and probe health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          timeout 15 bash -c 'until curl --fail http://127.0.0.1:8000/health; do :; done'
