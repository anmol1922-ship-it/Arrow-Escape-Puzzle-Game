name: Arrow Escape Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Validate, test, lint, and build frontend
        working-directory: frontend
        run: |
          mkdir -p ../artifacts
          npm run validate:levels 2>&1 | tee ../artifacts/frontend-validation.log
          npm run lint 2>&1 | tee ../artifacts/frontend-lint.log
          npm run test -- --run 2>&1 | tee ../artifacts/frontend-test.log
          npm run build 2>&1 | tee ../artifacts/frontend-build.log
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test backend
        working-directory: backend
        run: pytest -q 2>&1 | tee ../artifacts/backend-test.log
      - name: Create trace metadata and packages
        run: |
          printf 'commit=%s\nref=%s\ntag=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" > artifacts/build-metadata.txt
          cd frontend && zip -qr ../artifacts/frontend-dist.zip dist
          cd ../backend && zip -qr ../artifacts/backend-package.zip app requirements.txt requirements-dev.txt pytest.ini Dockerfile
      - name: Publish traceable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
